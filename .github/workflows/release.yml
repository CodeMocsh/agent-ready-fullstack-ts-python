name: release

# Copier resolves to the newest git tag rather than to main, so an untagged merge reaches
# nobody. That makes "remember to tag" a step whose omission is silent and looks exactly
# like a release that shipped. This removes the step.
#
# It runs on a *completed* check rather than on the push, because a tag is the one thing
# here that reaches users and it must never be cut from a tree the gate has not passed.
# Both firing on `push: main` would race, and the race publishes.
#
# VERSION decides which version, and GitHub writes what changed. `--generate-notes` lists
# the pull requests merged since the previous tag, which is the list a hand-written
# changelog carried -- except this one cannot fall out of step with what actually landed,
# and nobody has to copy it.

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: tag and release what VERSION claims
    # A gate that failed, was cancelled, or timed out must not reach the tag. Dispatch
    # carries no workflow_run and runs on its own authority.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The commit the gate actually passed. A workflow_run checkout defaults to the
          # tip of the default branch, which by now may be a commit nothing has checked.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read the version
        id: claimed
        run: |
          set -eu
          number="$(sh devtools/version.sh .)"
          printf 'version=v%s\n' "$number" >>"$GITHUB_OUTPUT"
          printf '    claimed v%s\n' "$number"

      # The question is whether the *release* exists, not whether the tag does. Tag first
      # and release second is two steps, and a failure between them used to leave a tag
      # that every later run read as "already done" -- so the release could never be
      # created and nothing said why. Asking about the release makes a retry repair it.
      #
      # Where the release does exist, the tag it points at is reported rather than assumed.
      # Skipping is right -- a commit that does not claim a new version is not a release --
      # but silence here reads identically to a release that shipped, and the difference
      # matters to whoever is waiting for one. The gate refuses a VERSION *lower* than the
      # newest released; this is the case where it is equal and the commit has moved on.
      - name: Decide whether this version is already released
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.claimed.outputs.version }}
        run: |
          set -eu
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            printf 'needed=yes\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'needed=no\n' >>"$GITHUB_OUTPUT"
          head="$(git rev-parse HEAD)"
          if ! git rev-parse -q --verify "refs/tags/$VERSION^{commit}" >/dev/null; then
            echo "    $VERSION is released but its tag is not in this checkout; nothing to do."
            exit 0
          fi
          tagged="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          if [ "$tagged" = "$head" ]; then
            echo "    $VERSION is already released, at this commit; nothing to do."
          else
            echo "    $VERSION is already released, at $tagged."
            echo "    This commit is $head, so nothing here ships until VERSION names a new version."
          fi

      - name: Tag and release
        if: steps.decide.outputs.needed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.claimed.outputs.version }}
        run: |
          set -eu
          target="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$VERSION^{commit}" >/dev/null; then
            tagged="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            if [ "$tagged" != "$target" ]; then
              echo "release: $VERSION already tags $tagged and this run is at $target." >&2
              echo "release: a released version is never moved. Claim a new one." >&2
              exit 1
            fi
            echo "    $VERSION is tagged already; creating the release it never got."
          else
            git -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
                -c 'user.name=github-actions[bot]' \
                tag -a "$VERSION" -m "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi
          gh release create "$VERSION" --title "$VERSION" --generate-notes
