# Questions asked when generating a project. This generates one application, so there is
# nothing to publish and no module name to choose -- the backend package is always `app`.
#
# Defaults here must stay behavior-preserving so `copier update --defaults` is a no-op
# for existing projects.

_min_copier_version: "9.5.0"
_subdirectory: template

package_name:
  type: str
  help: |
    Project name (used for the GitHub repo, the frontend package name and the
    backend project name).
  default: changeme
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    package_name must be lowercase kebab-case: start with a letter, then letters,
    digits and single hyphens (e.g. my-app). One name has to satisfy npm, PEP 503,
    GitHub and your filesystem at once, and this is their intersection.
    {% endif %}

package_description:
  type: str
  help: One-line description of the project.
  default: changeme

package_author_name:
  type: str
  help: Author name.
  default: changeme

package_author_email:
  type: str
  help: Author email.
  default: changeme@example.com

package_github_org:
  type: str
  help: GitHub org or username.
  default: changeme

package_license:
  type: str
  help: Which license?
  default: MIT
  choices:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - AGPL-3.0-or-later
    - Proprietary
    - None

# Whether `copier update` keeps bringing the example resource, `tasks`. A project that has
# replaced the example records false in .copier-answers.yml before an update, and from then on an
# update neither changes its own files at those paths nor re-adds the ones it deleted. Given on
# the update itself, false deletes those files: the old render still has them and the new one
# does not. A fresh copy always ships the example:
# the rest of the template is built on it, so the answer only takes effect on an update.
# docs/adr/0004-the-example-is-declined-on-update-and-never-on-copy.md says what was tried.
example_resource:
  type: bool
  help: >-
    Keep updating the example resource (`tasks`) on `copier update`? To stop, set it to false in
    .copier-answers.yml and commit before you update. Changing it to no during an update deletes
    the example's files, your edits included.
  default: true

# The same, for the identity stub: `app/identity.py`, which resolves every request to the
# sentinel tenant, and its tests. A project that has replaced it with real authentication
# records false the same way, and an update stops bringing the stub back.
identity_stub:
  type: bool
  help: >-
    Keep updating the identity stub (`app/identity.py`) on `copier update`? To stop, set it to
    false in .copier-answers.yml and commit before you update. Changing it to no during an
    update deletes the stub and its tests, your edits included.
  default: true

# Whether the project ships a GitHub Actions workflow. Unlike the two questions above, this one
# acts on a copy as well: a project hosted elsewhere, or one that runs its checks on its own CI,
# answers false and gets no `.github/` and no test of a workflow. On an update, false removes the
# workflow and its test, edited or not, because Copier removes a file the new render no longer
# has. A project generated before this question existed keeps its `.github/` until it deletes it.
github_ci:
  type: bool
  help: >-
    Ship a GitHub Actions workflow that runs the gate and the Postgres tier on every pull
    request and every push to main or master?
  default: true

_exclude:
  - "{% if not example_resource and _copier_operation == 'update' %}backend/app/models/tasks.py{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}backend/app/routes/tenant/tasks.py{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}backend/tests/routes/test_tasks.py{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/src/components/task-list.tsx{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/tests/components/task-list.test.tsx{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/e2e/tasks.spec.ts{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/e2e/tasks.live.spec.ts{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/src/api/tasks.ts{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/src/mocks/tasks.ts{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/src/mocks/store.ts{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/tests/api/tasks.contract.test.ts{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}frontend/e2e/tasks-client-events.live.spec.ts{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}backend/tests/routes/test_tenant_scoping.py{% endif %}"
  - "{% if not example_resource and _copier_operation == 'update' %}backend/tests/integration/test_tasks_on_postgres.py{% endif %}"
  - "{% if not identity_stub and _copier_operation == 'update' %}backend/app/identity.py{% endif %}"
  - "{% if not identity_stub and _copier_operation == 'update' %}backend/tests/identity/test_identity.py{% endif %}"
  - "{% if not identity_stub and _copier_operation == 'update' %}backend/tests/identity/doubles.py{% endif %}"
  - "{% if not identity_stub and _copier_operation == 'update' %}backend/tests/routes/test_guarantee.py{% endif %}"
  # No workflow, and no test of one, for a project that runs its checks somewhere else.
  - "{% if not github_ci %}.github{% endif %}"
  - "{% if not github_ci %}backend/tests/test_workflow.py{% endif %}"
  # The project's tests of what its production refuses. Nothing imports a test, so a project may
  # delete this one; it is excluded on update rather than skipped, so it never comes back.
  - "{% if _copier_operation == 'update' %}backend/tests/environment/test_environment.py{% endif %}"
  # Generated from the project's own code, so an update never touches them and the project
  # regenerates them afterwards: `make openapi` writes the first two, `make lint` the third.
  # A merged copy of any of them describes neither tree.
  - "{% if _copier_operation == 'update' %}openapi.json{% endif %}"
  - "{% if _copier_operation == 'update' %}frontend/src/api/schema.ts{% endif %}"
  - "{% if _copier_operation == 'update' %}backend/.complexity-baseline.json{% endif %}"

# Written once and then the project's: an update adds one that is missing and never touches
# one that exists. Each holds only a project's own list -- its refusals, what its production
# refuses, its tiers, its model layering, its log lines, how its browser tests sign in -- and the
# mechanism around it is a module the template keeps updating. docs/adr/template/0015. A project
# cannot delete one of these but log_lines.py, because the template's code imports each, so
# `_skip_if_exists` never re-adds one somebody removed. A deleted log_lines.py returns empty.
_skip_if_exists:
  - backend/app/errors.py
  - backend/app/environment.py
  - backend/app/request_line.py
  - backend/app/log_lines.py
  - backend/tests/tiers.py
  - backend/tests/models/layers.py
  - frontend/e2e/signed-in.ts
  # The docs AGENTS.md sends an agent to for a project's own detail. A project rewrites each with
  # its own, so a template change to one would conflict on every update. A new project gets the
  # template's first version; AGENTS.md links all three, so a deleted one comes back on update.
  - docs/frontend.md
  - docs/backend.md
  - docs/development.md

# Computed, never asked. The frontend package.json needs an SPDX expression, and npm
# spells "no license" as UNLICENSED.
package_license_spdx:
  type: str
  when: false
  default: >-
    {% if package_license in ['None', 'Proprietary'] %}UNLICENSED{% else %}{{ package_license }}{% endif %}

_message_after_copy: |

  Your project is ready at {{ _copier_conf.dst_path }}.

      cd {{ _copier_conf.dst_path }}
      git init && git add . && git commit -m "Initial commit from agent-ready-fullstack-ts-python"
      make install
      git add frontend/pnpm-lock.yaml backend/uv.lock && git commit -m "Add lockfiles"

  Commit before `make install`: the installer activates this project's git hooks, and
  that needs a repository to install them into. Commit the lockfiles it produces too --
  no lockfile ships with the template, because a fresh project should resolve against
  today's registry rather than the day the template was written{% if github_ci %}, and CI installs
  from the lockfiles with --frozen{% endif %}.

  Then, in one terminal:

      make dev            # both halves: backend on :8000, frontend on :5173
      make dev-frontend   # or just the frontend, in mock mode, with no backend at all

  Check everything works:

      make lint test      # both halves, then the contract suite across both

  The backend authenticates nothing yet. Every request resolves to the tenant `default`,
  which is what lets this run with no issuer and no key -- and it means anyone who can
  reach the process can read and write everything it holds. Replace `tenant_for()` in
  `backend/app/identity.py` before it is reachable by anyone you do not trust. Until you
  do, every startup says so; `UNAUTHENTICATED_IS_INTENTIONAL=1` records that you meant it.

  The agent-ready layer is opt-in. To use it, install Entire and enable it:

      curl -fsSL https://entire.io/install.sh | bash && entire enable

  Enabling it means a pre-push hook sends each agent session -- the transcript, and the
  prompts in it -- to your remote as `refs/entire/*`. Those refs do not appear anywhere in
  the GitHub interface, and anyone who can read the repository can fetch them. That is
  what you want for a repository only you read, and not what you want for a public one or
  one with outside collaborators. `enabled: false` in `.entire/settings.json` turns it off
  for every clone.

  Or delete `.claude/` and `.entire/` to opt out entirely.
