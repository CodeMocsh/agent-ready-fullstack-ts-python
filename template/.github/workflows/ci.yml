name: CI

# The gate runs `make pre-commit` -- the same target the git hook runs.
#
# Not a list of steps that happens to match the gate. A re-listed copy drifts, always in
# the direction of checking less, and the drift surfaces as a green push that a commit
# would have refused. backend/tests/test_gate.py fails on a workflow that does not name
# the target, and it reads this file with comments stripped, so naming it here would not
# satisfy the check.
#
# The gate is deliberately the fast tier: lint, the contract artifacts, and the tests that
# need nothing fetched or started. Add a tier to that job and the check people wait on stops
# being the check they can run.
#
# A second job runs `make db-test`. That tier needs only Docker, which the runner has, and
# it is the one place tenant isolation is checked against a real Postgres. The job adds a
# status of its own rather than time to the gate, and a laptop with no Docker never runs the
# tier -- so without this job nothing does. The browser tiers stay out: `make test-e2e`
# fetches a browser, and the live one needs `make dev` running beside it. So does
# `make observe-test`: it checks the viewer `make observe` starts on a laptop, which no
# deployment runs.

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # There is no root package.json; the version lives in the half's own.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # backend/pyproject.toml requires this floor: older uv rejects the relative
          # exclude-newer with a date-parsing error naming neither.
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Installed directly rather than through `make install`, which also arms the git
      # hooks -- there is no commit to gate here. Both halves install frozen, so a
      # lockfile that does not match its manifest fails here rather than resolving
      # something no developer has.
      - run: pnpm -C frontend install --frozen-lockfile

      - name: Install the backend
        working-directory: backend
        run: |
          uv python install
          uv sync --all-groups --frozen

      - run: make pre-commit

  db:
    runs-on: ubuntu-latest
    # A container that never comes up leaves the recipe waiting. This is where it stops.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend
        working-directory: backend
        run: |
          uv python install
          uv sync --all-groups --frozen

      - run: make db-test
