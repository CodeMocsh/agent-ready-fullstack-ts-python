name: CI

# The gate runs `make gate` -- the list the git hook runs through devtools/gate.sh. Not
# the pre-commit target: its runner skips a half that is not installed, and here a missing half
# must fail.
#
# Not a list of steps that happens to match the gate. A re-listed copy drifts, always in
# the direction of checking less, and the drift surfaces as a green push that a commit
# would have refused. backend/tests/test_workflow.py fails on a workflow that does not name
# the target, and it reads this file with comments stripped, so naming it here would not
# satisfy the check.
#
# The gate is deliberately the fast tier: lint, the contract artifacts, and the tests that
# need nothing fetched or started. Add a tier to that job and the check people wait on stops
# being the check they can run.
#
# A second job runs `make db-test`. That tier needs Docker or the Postgres server binaries,
# and the runner has both. It is the one place tenant isolation is checked against a real
# Postgres. The job adds a status of its own rather than time to the gate, and a laptop with
# neither never runs the tier -- so without this job nothing does. The browser tiers stay
# out: `make test-e2e` needs a browser, and the live one needs `make dev` running beside it.
# So does `make observe-test`: it checks the viewer `make observe` starts on a laptop, which
# no deployment runs.

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

# Every install here refuses a lockfile that is missing or does not match its manifest, so CI
# never resolves something no developer has. `uv sync --frozen` would not compare the lockfile
# with the manifest at all. A laptop sets neither, so `make install` there still writes a
# lockfile after a manifest edit.
env:
  UV_LOCKED: "1"
  pnpm_config_frozen_lockfile: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # There is no root package.json; the version lives in the half's own.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # backend/pyproject.toml requires this floor: older uv rejects the relative
          # exclude-newer with a date-parsing error naming neither.
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend's Python
        working-directory: backend
        run: uv python install

      # The script `make install` runs, without a browser, which the gate does not use.
      - run: sh devtools/install.sh

      - run: make gate

  db:
    runs-on: ubuntu-latest
    # A container that never comes up leaves the recipe waiting. This is where it stops.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend
        working-directory: backend
        run: |
          uv python install
          uv sync --all-groups

      - run: make db-test
