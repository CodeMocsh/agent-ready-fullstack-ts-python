name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

# Every install here refuses a lockfile that is missing or does not match its manifest, so CI
# never resolves something no developer has. `uv sync --frozen` would not compare the lockfile
# with the manifest at all. A laptop sets neither, so `make install` there still writes a
# lockfile after a manifest edit.
env:
  UV_LOCKED: "1"
  pnpm_config_frozen_lockfile: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # There is no root package.json; the version lives in the half's own.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # backend/pyproject.toml requires this floor: older uv rejects the relative
          # exclude-newer with a date-parsing error naming neither.
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend's Python
        working-directory: backend
        run: uv python install

      # The script `make install` runs, without a browser, which the gate does not use.
      - run: sh devtools/install.sh

      - run: make suite

  db:
    runs-on: ubuntu-latest
    # A container that never comes up leaves the recipe waiting. This is where it stops.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend
        working-directory: backend
        run: |
          uv python install
          uv sync --all-groups

      - run: make db-test
