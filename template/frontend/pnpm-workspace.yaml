# Supply-chain policy applied to every install in this project. Each setting below
# carries its own reasoning.

# Cool-off period, in minutes (7 days). A release younger than this is not
# considered during resolution; most malicious publishes are caught within days.
minimumReleaseAge: 10080

# Fail when a package's trust evidence gets weaker than the version you already
# have -- a trusted-publisher release replaced by one with only provenance, or
# with none at all. That downgrade is what a compromised maintainer account
# looks like.
trustPolicy: no-downgrade

# The check compares publish dates, not semver, so a maintained older release
# line looks like a downgrade: semver 6.3.1 is a 2023 maintenance release that
# happens to postdate a 7.x with provenance. It reaches this project through
# shadcn -> @babel/core, and without this line neither `pnpm install` nor
# `pnpm dlx shadcn add` can run at all.
#
# Exclusions are pinned to an exact version on purpose. Widening one to a range,
# or reaching for `trustPolicy: off`, gives up the check everywhere -- if you
# need a second entry, that is a decision worth arguing for in the PR.
trustPolicyExclude:
  - 'semver@6.3.1'

# The cool-off has a cost: a patch that fixes a high-severity advisory is unavailable
# for as long as everything else, so a fresh install resolves the vulnerable version.
# When a fix cannot wait, let that one release through, in two parts. The floor is the
# fix, an entry under overrides below. The exclusion lets the floor resolve before the
# fix ages past the cool-off: a top-level `minimumReleaseAgeExclude:` list, holding an
# entry pinned to that exact version, such as 'name@1.2.3'.
#
# That is the same shape as trustPolicyExclude above, for the same reason. A bare
# `name` would exempt every future release of it from the cool-off, which is a
# permanent hole opened to close a temporary one. Once the fix has aged past the
# cool-off, the exclusion buys nothing and should go. The floor stays.
#
# nanoid and source-map-js reach this project through vite -> postcss. Every nanoid
# below 3.3.18 carries GHSA-2v37-7h3g-55p8 (a custom generator can loop forever when
# size is 0), and every source-map-js below 1.2.2 carries GHSA-68fv-2mgg-jv7q.
overrides:
  nanoid: '^3.3.18'
  source-map-js: '^1.2.2'

# How long a `pnpm dlx` package stays usable from the store without re-resolving,
# in minutes (30 days). The default is a day, which would mean `make openapi` --
# and therefore `make pre-commit`, which every commit runs -- reaching the registry
# on the first commit of each day, and failing outright with no network.
#
# Safe here only because there is exactly one dlx call and it names an exact version:
# `openapi-typescript@7.13.0` in package.json. A floating spec cached for a month
# would be a floating spec that silently stopped floating. If you add a dlx call
# without a pinned version, this line is wrong for it.
dlxCacheMaxAge: 43200

# pnpm blocks dependency install scripts by default, which is the right default
# and the reason this list is short. msw is the one exception: its postinstall
# rewrites public/mockServiceWorker.js to match the installed msw version, and
# a worker script that drifts from the library fails at runtime with an
# integrity mismatch rather than at install time.
allowBuilds:
  msw: true
